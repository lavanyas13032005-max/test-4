<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <main class="login-card" role="main">
      <header class="login-header">
        <div class="logo-badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Please enter your credentials to sign in.</p>
      </header>

      <div id="statusMessage" class="status-banner" role="alert" aria-live="polite" hidden></div>

      <form id="loginForm" class="login-form" novalidate>
        <!-- Email / Username Field -->
        <div class="form-group" id="emailGroup">
          <label for="email" class="form-label">Email or Username</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input
              type="text"
              id="email"
              name="email"
              class="form-input"
              placeholder="name@example.com"
              autocomplete="username"
              required
              aria-describedby="emailError"
            >
          </div>
          <span id="emailError" class="field-error" aria-live="polite"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group" id="passwordGroup">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
            <a href="#forgot" id="forgotPasswordLink" class="text-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-describedby="passwordError"
            >
            <button
              type="button"
              id="togglePasswordBtn"
              class="toggle-password"
              aria-label="Show password"
              title="Show password"
            >
              <svg id="eyeIcon" class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeOffIcon" class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span id="passwordError" class="field-error" aria-live="polite"></span>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span class="custom-checkbox" aria-hidden="true"></span>
            <span class="checkbox-label">Remember me for 30 days</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" aria-hidden="true" hidden></span>
        </button>
      </form>

      <footer class="login-footer">
        <p>Don't have an account? <a href="#signup" class="text-link font-semibold">Sign up</a></p>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
